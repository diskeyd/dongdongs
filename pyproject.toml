[project]
name = "dongdongs"
version = "0.1.0"
description = "PDF test report to HWP report semi-automation: watermark-object removal, table and graph extraction, reviewed HWP edits"
authors = [
    { name = "diskeyd" }
]
requires-python = ">=3.12,<3.13"
dependencies = [
    "google-genai>=2.23.0",
    "jinja2>=3.1.6",
    "pillow>=12.3.0",
    "pyhwp>=0.1b15",
    "pymupdf>=1.28.2",
    "pyhwpx>=1.7.2 ; sys_platform == 'win32'",
    "pywin32>=312 ; sys_platform == 'win32'",
    "pyyaml>=6.0.3",
    "six>=1.17.0",  # pyhwp (hwp5) imports six but does not declare it
]

[project.scripts]
dongdongs = "dongdongs.cli:main"

[build-system]
requires = ["uv_build>=0.12.13,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "hypothesis>=6.168.0",
    "pytest>=9.1.1",
    "ruff>=0.16.7",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 200
extend-exclude = ["local", "work", "tests/local"]

[tool.ruff.lint]
select = ["E", "F", "W", "B", "UP"]
ignore = ["E501", "B905"]
