# Institution rules.
#
# Watermark rules describe independent PDF objects that may be deleted. A page
# is changed only when every condition of a rule holds; anything else is left
# untouched and reported as review_required (handoff sections 5.4 and 5.5).
#
# Supported watermark kinds: image_xobject. Other kinds are reported as
# unsupported and never delete anything.

# HWP report format. One report is filled from several test reports, one
# section per test. A section starts on the page whose cell begins with
# "N. name(code)" and runs to the page before the next section.
report:
  section_heading_pattern: "^(\\d{1,3})\\.\\s*(\\S.*)$"
  # only a Latin code in brackets counts as a test code ("(TDload2)" yes, "(일반)" no)
  section_code_pattern: "\\(([A-Za-z][A-Za-z0-9_]*)\\)\\s*$"

institutions:
  KERI:
    detect:
      text_any: ["KERI", "한국전기연구원", "Korea Electrotechnology Research Institute"]
      min_pages: 1

    watermarks:
      - id: ezpdf-draft-image
        kind: image_xobject
        expected_text: DRAFT
        image:
          width: 521
          height: 623
          # sha256 of the decoded image bytes (pymupdf extract_image)
          sha256: 14630924c360882ea575e35a1fe5c5df316d12502e4a6fca98b14a043b6385b5
        draw:
          # the draw block must sit after this comment in the content stream
          after_marker: "%EZPDF-RestorePage"
          # the block's ExtGState fill alpha (/ca) must be below this value
          require_extgstate_alpha_below: 1.0
        # the rule must match on at least this share of pages or nothing is removed
        min_page_ratio: 0.9

    protect:
      # Footer layer. Despite its name, the optional content group
      # "ezPDF Watermark" draws the page number "n of N", the document code
      # and the address line. It is not the DRAFT stamp and is never removed.
      ocg_names: ["ezPDF Watermark"]

    footer_band_pt: 770

    sections:
      # a page titled like this lists every test of the report: number, name(code), place, start page
      index_title: "시험 결과"
      code_pattern: "\\((TD\\w+)\\)"
      min_entries: 2
      # printed page numbers are PDF page numbers in these reports
      page_offset: 0
      # table-of-contents entries that follow the last test (its end = their page - 1)
      end_titles: ["도면", "첨부", "안내문"]

    tables:
      known_sections: ["Supply circuit", "Load circuit", "Prospective TRV"]

    regions:
      # half-width graphs (two side by side under a full-width one) are ~240 pt wide
      min_width_pt: 200
      min_height_pt: 100
      title_gap_pt: 22
      kinds:
        "시험회로도": circuit_diagram
        "Osc.": oscillogram
        "사진": photo
      export_kinds: [circuit_diagram, oscillogram]
      dpi: 300

    pictures:
      # header cell text of the table whose first cell holds the circuit diagram
      circuit_anchor: "Circuit components"
      # graph pages: one big cell per page with a title line and the graphs below it
      oscillogram_page:
        title_pattern: "^Osc\\. \\S+$"
        # inside width of the big cell (cell width minus left/right padding), mm
        inner_width_mm: 168.8
        # space between the two half-width graphs, mm (slack so the pair never wraps)
        gap_mm: 1.5
        # title line, blank lines and paragraph spacing above the graphs, mm
        reserved_height_mm: 14.0
        # cell top/bottom padding, mm
        padding_height_mm: 1.0
      # oscillogram tables (picture cells under a header cell); filled with the graphs no graph page took
      oscillogram_slots:
        header_text: "오실로그램"
